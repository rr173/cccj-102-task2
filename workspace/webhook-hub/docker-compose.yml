# 一条命令启动完整运行环境（投递中枢 + 模拟接收方）：
#   docker compose up --build
services:
  hub:
    build: .
    image: webhook-hub
    ports:
      - "8080:8080"
    environment:
      WHUB_DB: /data/whub.db
      WHUB_HTTP_TIMEOUT: "5"
    volumes:
      - whub-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sink:
    build: .
    image: webhook-hub
    command: ["sink", "--port", "9000",
              "--register", "key-demo:whsec_demo_secret"]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  whub-data:
